[package]
name = "osm-diffs"
version = "0.8.1"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
arrow = { version = "59.0.0", default-features = false }
arrow-buffer = { version = "59.1.0", default-features = false }
arrow-schema = { version = "59.1.0", default-features = false }
aws-lc-rs = { version = "1.17.0", default-features = false }
clap = { version = "4.6.1", default-features = false, features = ["derive", "help", "std", "usage"] }
deepsize = "0.2.0"
deepsize_derive = "0.1.2"
env_logger = { version = "0.11.10", default-features = false }
ext-sort = { version = "0.1.5", features = ["memory-limit"] }
futures-util = { version = "0.3.32", default-features = false }
geo = "0.33.1"
geo-traits = { version = "0.3.0", default-features = false }
geojson = "1.0.0"
indicatif = { version = "0.18.4", default-features = false }
log = { version = "0.4.32", default-features = false, features = ["kv"] }
lru = { version = "0.18.0", default-features = false }
lz4_flex = "0.14.0"
memmap2 = "0.9.10"
once_cell = "1.21.4"
# >=0.2.3, not the usual ^0.2.2: this project's own timestamp handling
# (pipeline::conflate::writer) is coupled to a fix that landed in
# osm_pbf_iter 0.2.3 (astro/rust-osm-pbf-iter#96) -- see #749.
osm_pbf_iter = { version = ">=0.2.3", default-features = false }
parquet = { version = "59.0.0", default-features = false, features = ["arrow", "geospatial", "zstd"] }
parquet-geospatial = { version = "59.1.0", default-features = false }
piz = "0.5.1"
prost = "0.14.4"
protobuf_iter = { version = "0.1.3", default-features = false }
rayon = "1.12.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rmp-serde = { version = "1.3.1", default-features = false }
rustls = { version = "0.23.40", default-features = false, features = ["aws_lc_rs"] }
s2 = "0.2.0"
s3 = { version = "0.1.36", default-features = false, features = ["blocking", "multipart", "rustls"] }
serde = "1.0.228"
serde_json = { version = "1.0.150", default-features = false, features = ["std"] }
tempfile = "3.27.0"
time = { version = "0.3.53", default-features = false, features = ["formatting", "parsing", "std"] }
tokio = { version = "1.52.3", default-features = false }
uuid = { version = "1.24.0", default-features = false, features = ["v4"] }
webpki-roots = "1.0.6"
wkb = "0.9.2"

# Only used on macOS, to call getrusage() for src/memstats.rs: the Linux
# path reads /proc and /sys/fs/cgroup instead, no FFI needed. Scoping it
# this way keeps it out of the Linux/musl production build entirely.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.2.2"
mockito = { version = "1.7.2", default-features = false }
predicates = "3.1.4"
wkt = "0.14.0"

[build-dependencies]
prost-build = "0.14.4"
